<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Bodyguard Link Checker</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <header class="brand-row"><span class="brand-mark" aria-hidden="true">⬡</span><span class="brand">bodyguard<span>.</span></span><span class="live"><i></i> LINK CHECKER</span></header>
    <p class="label">CURRENT TAB</p>
    <div id="url" class="url" aria-label="Current tab address">Reading page…</div>
    <button id="check" type="button"><span class="button-icon" aria-hidden="true">⌕</span> Check this link <span class="arrow" aria-hidden="true">→</span></button>
    <section id="result" aria-live="polite" aria-atomic="true" hidden></section>
    <p class="note">Your tab is only sent to the Bodyguard scanner after you click the button.</p>
  </main>
  <script src="popup.js"></script>
</body>
</html>
