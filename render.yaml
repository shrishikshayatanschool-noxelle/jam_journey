services:
  - type: web
    name: bodyguard-ai
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /
    autoDeployTrigger: off
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: TRUST_PROXY
        value: "1"

